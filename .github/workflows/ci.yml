name: verify and publish

# One workflow rather than two, because publishing must not be able to happen
# without verification passing. Separate files cannot express that dependency.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  IMAGE: ghcr.io/heurema/goalrail-web

jobs:
  verify:
    name: lint, typecheck, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      # `npm run build` runs `tsc -b` before Vite, so this is the typecheck too.
      - run: npm run build
      # The deployed artifact is the image, not the directory, so the image is
      # what has to build. Without this a broken Dockerfile would only be found
      # by the publish job, on main, after review.
      - name: Build the image
        run: docker build -t "${IMAGE}:ci" .
      - name: Serve it and check the routes that have broken before
        run: |
          set -euo pipefail
          docker run -d --name goalrail-ci -p 8080:80 "${IMAGE}:ci"
          for attempt in $(seq 1 30); do
            if curl -fsS -o /dev/null http://localhost:8080/; then break; fi
            if [ "${attempt}" -eq 30 ]; then
              docker logs goalrail-ci
              echo "the container never served /" >&2
              exit 1
            fi
            sleep 1
          done

          check() {
            local path="$1" expected="$2" description="$3"
            local actual
            actual="$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:8080${path}")"
            if [ "${actual}" != "${expected}" ]; then
              echo "${path}: expected ${expected}, got ${actual} — ${description}" >&2
              exit 1
            fi
          }

          check / 200 'the landing page'
          check /docs/install 200 'a client route must fall back to the shell'
          check /docs/install.md 200 'the raw markdown an agent fetches'
          check /llms.txt 200 'the agent index'
          # The fallback must not swallow this: a missing document answering 200
          # with HTML is the one failure an agent cannot detect.
          check /docs/no-such-page.md 404 'a missing document must say so'

          type="$(curl -sS -o /dev/null -w '%{content_type}' http://localhost:8080/docs/install.md)"
          case "${type}" in
            text/markdown*) ;;
            *) echo "install.md served as ${type}, not text/markdown" >&2; exit 1 ;;
          esac
      - if: always()
        run: docker rm -f goalrail-ci || true

  publish:
    name: publish the image
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      # The runner's default builder cannot export a cache; the layer cache
      # below needs the container driver this sets up.
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The shape the cluster's image policy selects on: a commit to identify
      # the build and a timestamp to order it. Same convention as the other
      # applications in the cluster, so one policy pattern covers them all.
      - id: tag
        run: echo "value=dev-$(git rev-parse --short=7 HEAD)-$(date -u +%Y%m%d%H%M%S)" >>"${GITHUB_OUTPUT}"
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.tag.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: echo "Published ${IMAGE}:${{ steps.tag.outputs.value }}" >>"${GITHUB_STEP_SUMMARY}"
