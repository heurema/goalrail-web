# How the site is served.
#
# This lives with the site rather than with the cluster because it describes
# this site's routes — which paths are client-side, which are files an agent
# fetches — and those change when the site changes, not when the cluster does.

server {
    listen 80;
    server_name _;
    root /srv/goalrail;
    index index.html;

    charset utf-8;
    charset_types text/plain text/markdown text/css application/javascript image/svg+xml;

    gzip on;
    gzip_types text/plain text/markdown text/css application/javascript image/svg+xml;
    gzip_min_length 512;

    # Documentation is served as raw markdown for agents and rendered by the
    # client for people. Without a type these download instead of displaying;
    # without the =404 a typo would answer with the page shell at 200, which is
    # the one failure an agent cannot see.
    location ~ \.md$ {
        default_type text/markdown;
        try_files $uri =404;
    }

    # Build output is content-hashed, so it can be cached indefinitely.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Everything else is a client route.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
